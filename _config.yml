title: The Vanadzor Index
description: >-
  An offline-friendly local directory for Vanadzor, Armenia —
  doctors, government services, taxis, repair services, restaurants, hotels,
  and things to do, all in one searchable page.
lang: en

# index.html is built from src/ by build.py and served as-is, with no Jekyll
# templating to apply — so no theme or plugins are needed.
theme: null
plugins: []

# Keep repo housekeeping files out of the published site.
exclude:
  - README.md
  # Licensing: LICENSE covers the content, LICENSE-CODE the code, and
  # LICENSES.md maps which part of the built page each one governs.
  - LICENSE
  - LICENSE-CODE
  - LICENSES.md
  - vanadzor-masthead.psd
  # Icon artwork — the rasterized icons in favicon_assets/ are what the site
  # serves; the nested favicon_src/ (sources) is reference material only.
  - favicon_assets/favicon_src
  # Notion source exports — reference material, not part of the site.
  - "*.zip"
  # Upstream sync scripts and their CSVs — tooling, not part of the site.
  - notion_tables_one-way_bridge
  # The log of what still has to be replayed upstream — a working file for
  # whoever runs the sync, not something the site serves.
  - SOURCE-SYNC.md
  # Sources for index.html and the script that assembles them. The built
  # index.html is what gets served; these are the files it is built from.
  - src
  - build.py
